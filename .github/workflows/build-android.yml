name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberSafe-ID-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package Android Studio source
        if: success()
        run: |
          zip -r CyberSafe-ID-AndroidStudio-source.zip . \
            -x ".git/*" ".gradle/*" "app/build/*" "build/*"

      - name: Upload source ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CyberSafe-ID-AndroidStudio-source
          path: CyberSafe-ID-AndroidStudio-source.zip
          retention-days: 30
