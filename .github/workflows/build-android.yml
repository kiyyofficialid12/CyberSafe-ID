name: Build CyberSafe ID

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberSafe-ID-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package Android Studio source
        run: |
          zip -r CyberSafe-ID-AndroidStudio-source.zip . \
            -x ".git/*" ".gradle/*" "app/build/*" "build/*"

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CyberSafe-ID-AndroidStudio-source
          path: CyberSafe-ID-AndroidStudio-source.zip
          if-no-files-found: error
          retention-days: 30
